<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#588ce3">
  <title>智友</title>
  <link rel="stylesheet" href="/secretary/styles.css">
</head>
<body class="wx-body wx-body--list">
  <header class="wx-top">
    <button type="button" class="wx-top-add wx-top-add--left" id="btnCreateGroup" aria-label="发起群聊">👥</button>
    <h1 class="wx-top-title">智友</h1>
    <button type="button" class="wx-top-add" id="btnTools" aria-label="工具">＋</button>
  </header>

  <div class="wx-search">
    <span class="wx-search-icon" aria-hidden>⌕</span>
    <input type="search" id="searchInput" placeholder="搜索" autocomplete="off" />
  </div>

  <main class="wx-list" id="friendList" aria-label="AI 好友"></main>

  <nav class="wx-tabbar wx-tabbar--icons" aria-label="底部导航">
    <a class="wx-tab" href="/" aria-label="宝盒">
      <img class="wx-tab-icon wx-tab-icon--svg" src="/icons/treasurebox.svg" width="24" height="24" alt="" />
    </a>
    <a class="wx-tab" href="/?note=1" aria-label="Note">
      <span class="wx-tab-icon" aria-hidden>📝</span>
    </a>
    <a class="wx-tab" href="/adhd-flow/" aria-label="待办">
      <span class="wx-tab-icon" aria-hidden>✅</span>
    </a>
    <a class="wx-tab" href="/settings" aria-label="我">
      <span class="wx-tab-icon" aria-hidden>👤</span>
    </a>
  </nav>

  <div class="wx-sheet" id="toolSheet" hidden>
    <div class="wx-sheet-mask" id="toolMask"></div>
    <div class="wx-sheet-panel">
      <p class="wx-sheet-title">宝盒工具</p>
      <div class="wx-sheet-grid" id="toolGrid"></div>
    </div>
  </div>

  <div class="wx-sheet" id="groupSheet" hidden>
    <div class="wx-sheet-mask" id="groupMask"></div>
    <div class="wx-sheet-panel">
      <p class="wx-sheet-title">发起群聊 · 选择 AI</p>
      <div class="wx-group-pick" id="groupPick"></div>
      <button type="button" class="wx-group-start" id="btnStartGroup" disabled>开始群聊</button>
    </div>
  </div>

  <script src="/secretary/config.js" defer></script>
  <script src="/secretary/common.js" defer></script>
  <script src="/secretary/list.js" defer></script>
</body>
</html>
