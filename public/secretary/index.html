<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#588ce3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>AI 私人秘书</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wx-app">
    <header class="wx-nav">
      <a class="wx-nav-back" href="../" aria-label="返回">‹</a>
      <h1 class="wx-nav-title">AI 私人秘书</h1>
      <button type="button" class="wx-nav-more" id="btnClear" aria-label="清空对话">···</button>
    </header>

    <main class="wx-chat" id="chatMain" aria-live="polite"></main>

    <footer class="wx-bar">
      <form class="wx-input-row" id="chatForm">
        <button type="button" class="wx-tool-btn" aria-hidden="true" tabindex="-1">🎤</button>
        <div class="wx-input-wrap">
          <textarea
            id="chatInput"
            rows="1"
            placeholder="发消息…"
            autocomplete="off"
            maxlength="4000"
            enterkeyhint="send"
          ></textarea>
        </div>
        <button type="button" class="wx-tool-btn" aria-hidden="true" tabindex="-1">☺</button>
        <button type="submit" class="wx-send" id="btnSend" aria-label="发送">发送</button>
      </form>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
