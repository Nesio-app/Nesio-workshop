name: Deploy Inner Shelter API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inner-shelter-ios/api/**'
      - 'inner-shelter-ios/vercel.json'
      - 'inner-shelter-ios/package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: inner-shelter-ios/package-lock.json

      - name: Install dependencies
        working-directory: inner-shelter-ios
        run: npm ci

      - name: Deploy to Vercel
        working-directory: inner-shelter-ios
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "跳过：未配置 VERCEL_TOKEN secret"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
