name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio (static export)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Bundle memorial static site
        run: |
          mkdir -p out/memory
          cp -R memory/public/. out/memory/
          touch out/.nojekyll out/memory/.nojekyll
          test -f out/memory/index.html
          test -f out/memory/js/memorial-i18n.js
          test -f out/memory/content/membook-samples.json
          echo "Memorial bundle OK ($(find out/memory -type f | wc -l) files)"

      - name: Bundle toolbox static apps
        run: |
          rm -rf out/fitness
          mkdir -p out/adhd-flow out/fitness
          cp -R adhd-flow-ios/web/. out/adhd-flow/
          cp -R fitness/web/. out/fitness/
          echo "window.FITNESS_API='https://fitness-psi-rouge.vercel.app';" > out/fitness/config.js
          test -f out/adhd-flow/index.html
          test -f out/fitness/index.html
          test -f out/fitness/theme-skin.css
          test -f out/fitness/portal-embed.css
          test -f out/fitness/icons.js
          echo "Toolbox apps OK (adhd-flow + fitness)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
