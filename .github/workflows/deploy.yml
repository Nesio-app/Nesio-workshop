name: Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# 按 ref 分组:main 的 push run 与各 PR 的 run 互不取消。
# 之前用写死的全局组 + cancel-in-progress,导致 main 一有 push 就把正在跑的 PR verify 掐掉,
# 表现为「CI 莫名不注册/被取消」。每个分支/PR 各占一把锁,组内新推仍取消旧的(省算力)。
concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare toolbox static assets
        run: npm run bundle:toolbox

      - name: Run release guardrails
        run: npm run test:security

      - name: Report release status
        run: |
          mkdir -p release-evidence
          npm run report:release-status
          npm run report:release-status -- --markdown >> "$GITHUB_STEP_SUMMARY"
          npm run report:release-evidence
          npm run report:release-evidence -- --markdown >> "$GITHUB_STEP_SUMMARY"
          npm run report:release-evidence > release-evidence/release-evidence.json
          npm run report:release-evidence -- --markdown > release-evidence/release-evidence.md

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: release-evidence/

      - name: Build Vercel-compatible app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # L-1 循环:CI 红了必须有人知道。失败时开/更新带 ci-failure 标签的 issue。
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'CI 红灯:Release Verification 失败';
            const body = [
              `**失败运行**: ${run}`,
              `**分支**: ${context.ref}`,
              `**提交**: ${context.sha.slice(0, 8)}`,
              '',
              '安全契约套件(test:security)或构建失败。本地复现:`npm run test:security`。',
              '红灯期间的合并都可能带着未被契约保护的回归。',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure'],
              });
            }
