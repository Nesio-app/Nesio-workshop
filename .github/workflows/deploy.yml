name: Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'release-verification'
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare toolbox static assets
        run: npm run bundle:toolbox

      - name: Run release guardrails
        run: npm run test:security

      - name: Report release status
        run: |
          mkdir -p release-evidence
          npm run report:release-status
          npm run report:release-status -- --markdown >> "$GITHUB_STEP_SUMMARY"
          npm run report:release-evidence
          npm run report:release-evidence -- --markdown >> "$GITHUB_STEP_SUMMARY"
          npm run report:release-evidence > release-evidence/release-evidence.json
          npm run report:release-evidence -- --markdown > release-evidence/release-evidence.md

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: release-evidence/

      - name: Build Vercel-compatible app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
