# 修复闭环:机器发现 → 机器修 → 人只审。
#
# 触发:① ci-failure / loop-report / prod-down / claude-fix 标签的 issue 出现
#      ② 任何 issue/PR 评论里 @claude(直接给它派活,包括写创意)
#
# 激活(二选一,未激活时本工作流零成本静默跳过):
#   方式 A(推荐,用你的 Claude 包月订阅,不按量计费):
#     本机终端跑 `claude setup-token` → 复制生成的长效 token →
#     repo Settings → Secrets → 新建 CLAUDE_CODE_OAUTH_TOKEN
#     (用量计入你订阅的额度窗口;偶发修复占用很小)
#   方式 B(API 按量计费):
#     新建 secret ANTHROPIC_API_KEY,值 = console.anthropic.com 的 key
#   两个都配时订阅 token 优先。
#
# 红线:只开 PR,永不直推 main;修复前必读 STATE.md;契约全绿才请求 review。
name: Claude Autofix

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  autofix:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'ci-failure') ||
        contains(github.event.issue.labels.*.name, 'loop-report') ||
        contains(github.event.issue.labels.*.name, 'prod-down') ||
        contains(github.event.issue.labels.*.name, 'claude-fix')
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Check activation (subscription token or API key)
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            [ -n "$OAUTH" ] && echo "::notice::使用 Claude 订阅 token(不按量计费)" || echo "::notice::使用 API key(按量计费)"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude Autofix 已就位但未激活。方式 A:本机跑 claude setup-token,把 token 存为 CLAUDE_CODE_OAUTH_TOKEN secret(用包月订阅);方式 B:存 ANTHROPIC_API_KEY(按量)。详见工作流头注释。"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Claude fix
        if: steps.key.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ github.event_name == 'issues' && format('修复这个 issue:#{0} {1}

            工作规则(仓库红线,必须遵守):
            1. 动手前先读 STATE.md(会话外记忆)和 issue 正文,理解两代产品交接背景
            2. 契约测试是字面断言,改 integrations/TodayFeed/Portal/DailyBriefCard/
               MemoryNodeDetail 前先读 scripts/anonymous-private-data-gate.test.mjs
            3. 验证命令:npx tsc --noEmit、npm run test:security(25 条 passed)、
               npm run loops(三项 TOTAL 全 0);涉及重构再跑 npm run test:contracts
            4. 只开 PR,永不直推 main;PR 描述里写清根因、修法、验证结果
            5. 修不动就在 issue 里评论说明卡在哪,不要硬改', github.event.issue.number, github.event.issue.title) || '' }}
          claude_args: '--max-turns 60'
