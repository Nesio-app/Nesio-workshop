<h1>轻推任务（ADHD Flow Planner）隐私政策</h1>
<p>最后更新：2026年6月</p>
<h2>数据存储</h2>
<p>任务、积分、停车场等内容默认保存在您设备本地的浏览器存储（localStorage）中，不会自动上传到我们的服务器。</p>
<h2>AI 功能</h2>
<p>当您使用 AI 整理、洞察或日程功能时，您输入的任务文本会发送至我们的 API 代理，再转发至 Google Gemini 进行处理。我们不会将此类数据用于广告或出售给第三方。</p>
<h2>日历</h2>
<p>同步到 Google 日历时，事件数据由 Google 日历服务处理，遵循 Google 的隐私政策。</p>
<h2>联系</h2>
<p>如有疑问，请通过应用内反馈或您的部署维护者联系。</p>
