  <p style="font-size:14px;line-height:1.7;color:var(--ink-soft)">
    溯 SÙ 以本地数据库为唯一真相源。原始 CGM 时序数据不会上传至云端叙事 API；
    仅发送紧凑统计摘要（约 1.5KB）供 Claude 生成日报叙事。Apple Health / Dexcom 同步需你主动授权。
    报告可单向写入 Notion；主观感受由你手填回流。本应用不提供医疗诊断。
  </p>
