# Codemagic 云端出包 —— Next.js/Capacitor(hosted webview)→ iOS → TestFlight。
# 老 Mac 不用碰;这条流水线在 Codemagic 的 macOS 机器上跑,签名 + 出 .ipa + 传 TestFlight。
# 见 docs/appstore/ios-packaging-plan.md 的「你要点的」清单(证书/集成/环境变量)。
#
# 一次性准备(在 Codemagic 控制台,不写在这):
#  1) 连接这个 Git 仓库。
#  2) Team integrations → App Store Connect:上传 App Store Connect API Key(.p8 + Key ID + Issuer ID)。
#  3) 建一个环境变量组 `appstore_credentials`,并把上面的集成绑进来(自动签名用)。
#  4) App Store Connect 里先建好 App 记录(拿到 bundle id = app.nesio.ios)。

workflows:
  ios-testflight:
    name: Nesio iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials        # ⬜ 在 Codemagic 控制台建;含 App Store Connect 集成
      vars:
        BUNDLE_ID: "app.nesio.ios"    # ⬜ 与 capacitor.config.ts appId 一致
        XCODE_SCHEME: "App"           # Capacitor 生成的默认 scheme
        XCODE_PROJECT: "ios/App/App.xcodeproj"
    integrations:
      app_store_connect: nesio_asc_key   # ⬜ Codemagic 里 App Store Connect 集成的名字
    scripts:
      - name: 安装依赖
        script: npm ci
      - name: 生成 iOS 原生工程(Capacitor)
        # ios/ 不入库,每次在云里从 capacitor.config.ts 现生成。
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: 写入 Info.plist 用途说明 + 出口合规
        # 用途串见 docs/appstore/submission-assets.md §6。位置/健康**不加**(v1 已构建期关)。
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '用于「拍一拍」记录物品与场景。'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '用于「说一句」语音记录。'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '用于从相册选取照片记录。'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
      - name: 设置签名(自动)
        script: |
          xcode-project use-profiles
      - name: 递增 build number
        script: |
          cd ios/App
          agvtool new-version -all "$(($(date +%s) / 60))" || true
      - name: 构建 IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # 出包后自动送 TestFlight,你 iPhone 17 装来测
        # submit_to_app_store: false   # 正式提审时再开
