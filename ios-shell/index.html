<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nesio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #071326; color: #c8d9f5;
      font-family: -apple-system, system-ui, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; text-align: center; padding: 2rem; }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #588ce3;
      animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
    p { font-size: .9rem; opacity: .75; }
  </style>
</head>
<body>
  <!--
    Capacitor 的 webDir 兜底页(hosted 模式 server.url 不可达时显示)。
    正常情况 App 加载远端合规部署;这页只在离线/首连失败时出现。
  -->
  <div class="wrap">
    <div class="dot"></div>
    <p>正在连接 Nesio…<br />Connecting to Nesio…</p>
  </div>
</body>
</html>
