<!-- @dsCard group="Colors" viewport="700x180" name="Surface & ink (day)" subtitle="Base, text, hairline + the app background gradient" -->
<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--portal-bg); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px; min-height: 92px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--portal-line); }
  .name { font-size: var(--text-xs); font-weight: 600; }
  .hex { font-size: 0.68rem; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--portal-bg); color: var(--portal-ink);"><span class="name">bg</span><span class="hex">#f4f8fd</span></div>
    <div class="sw" style="background: var(--portal-ink); color: #fff;"><span class="name">ink</span><span class="hex">#1e2a3a</span></div>
    <div class="sw" style="background: var(--portal-muted); color: #fff;"><span class="name">muted</span><span class="hex">#5a6d82</span></div>
    <div class="sw" style="background: var(--portal-bg-gradient); color: #fff;"><span class="name">bg gradient</span><span class="hex">light→mid→deep</span></div>
  </div>
</body>
</html>
