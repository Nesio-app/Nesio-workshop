<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--portal-bg); padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px 12px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  img { width: 46px; height: 46px; border-radius: 12px; }
  .n { font-size: 0.62rem; color: var(--portal-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col"><img src="../assets/icons/tools/secretary.svg"><span class="n">智友</span></div>
    <div class="col"><img src="../assets/icons/tools/plan.svg"><span class="n">待办</span></div>
    <div class="col"><img src="../assets/icons/tools/quiz.svg"><span class="n">刷题</span></div>
    <div class="col"><img src="../assets/icons/tools/storage.svg"><span class="n">收纳</span></div>
    <div class="col"><img src="../assets/icons/tools/psych.svg"><span class="n">咨询</span></div>
    <div class="col"><img src="../assets/icons/tools/sanctuary.svg"><span class="n">冥想</span></div>
    <div class="col"><img src="../assets/icons/tools/reading.svg"><span class="n">阅读</span></div>
    <div class="col"><img src="../assets/icons/tools/fitness.svg"><span class="n">健身</span></div>
    <div class="col"><img src="../assets/icons/tools/health.svg"><span class="n">溯</span></div>
    <div class="col"><img src="../assets/icons/tools/finance.svg"><span class="n">财务</span></div>
    <div class="col"><img src="../assets/icons/tools/lifesim.svg"><span class="n">人生</span></div>
  </div>
</body>
</html>
