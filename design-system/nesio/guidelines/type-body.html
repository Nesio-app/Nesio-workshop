<!-- @dsCard group="Type" viewport="700x180" name="Body, labels & overline" subtitle="Body 15 · secondary 14 · caption 12 · overline 11" -->
<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--portal-ink); background: var(--portal-bg); padding: 24px; }
  .stack > * { margin: 0 0 10px; }
  .muted { color: var(--portal-muted); }
  .overline { font-size: var(--text-overline); letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--portal-muted); }
  .meta { font-size: 0.62rem; color: var(--portal-blue-deep); }
</style>
</head>
<body>
  <div class="stack">
    <div class="overline">今日话语 · daily quote <span class="meta">overline 11 / .22em</span></div>
    <div style="font-size: var(--text-body); line-height: var(--leading-relaxed);">把注意力还给此刻。你已经做得很好了，休息也是前进。<span class="meta"> body 15 / 1.7</span></div>
    <div class="muted" style="font-size: var(--text-sm);">收纳 · 大后方 · 物品收纳 <span class="meta">secondary 14</span></div>
    <div class="muted" style="font-size: var(--text-xs);">保存在本机浏览器 <span class="meta">caption 12</span></div>
  </div>
</body>
</html>
