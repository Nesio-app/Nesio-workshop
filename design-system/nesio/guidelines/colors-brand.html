<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--portal-bg); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--portal-line); }
  .name { font-size: var(--text-xs); font-weight: 600; }
  .hex { font-size: var(--text-xs); opacity: 0.7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--portal-blue-light); color: var(--portal-ink);"><span class="name">blue-light</span><span class="hex">#cddefc</span></div>
    <div class="sw" style="background: var(--portal-blue-mid); color: var(--portal-ink);"><span class="name">blue-mid</span><span class="hex">#96c7f3</span></div>
    <div class="sw" style="background: var(--portal-blue-deep); color: #fff;"><span class="name">blue-deep · primary</span><span class="hex">#588ce3</span></div>
  </div>
</body>
</html>
