<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px grid — space-1 … space-16" -->
<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--portal-ink); background: var(--portal-bg); padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--portal-blue-deep); border-radius: 4px; width: 22px; }
  .n { font-size: 0.62rem; color: var(--portal-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height: var(--space-1);"></div><span class="n">1·4</span></div>
    <div class="col"><div class="bar" style="height: var(--space-2);"></div><span class="n">2·8</span></div>
    <div class="col"><div class="bar" style="height: var(--space-3);"></div><span class="n">3·12</span></div>
    <div class="col"><div class="bar" style="height: var(--space-4);"></div><span class="n">4·16</span></div>
    <div class="col"><div class="bar" style="height: var(--space-6);"></div><span class="n">6·24</span></div>
    <div class="col"><div class="bar" style="height: var(--space-8);"></div><span class="n">8·32</span></div>
    <div class="col"><div class="bar" style="height: var(--space-12);"></div><span class="n">12·48</span></div>
    <div class="col"><div class="bar" style="height: var(--space-16);"></div><span class="n">16·64</span></div>
  </div>
</body>
</html>
