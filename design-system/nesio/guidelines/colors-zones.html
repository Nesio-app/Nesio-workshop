<!-- @dsCard group="Colors" viewport="700x180" name="Zone tones — three cabins" subtitle="cool 秩序 · warm 觉察 · neutral 体现" -->
<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--portal-bg); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 14px; min-height: 100px; border: 1px solid var(--portal-line); display: flex; flex-direction: column; justify-content: space-between; }
  .dot { width: 22px; height: 22px; border-radius: 999px; }
  .name { font-size: var(--text-sm); font-weight: 600; }
  .sub { font-size: var(--text-xs); color: var(--portal-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: color-mix(in srgb, var(--portal-cool) 88%, white);"><div class="dot" style="background: var(--portal-cool-accent);"></div><div><div class="name" style="color: var(--portal-cool-accent);">cool · 秩序与跃迁</div><div class="sub">Order &amp; transition</div></div></div>
    <div class="sw" style="background: color-mix(in srgb, var(--portal-warm) 88%, white);"><div class="dot" style="background: var(--portal-warm-accent);"></div><div><div class="name" style="color: var(--portal-warm-accent);">warm · 觉察与锚定</div><div class="sub">Awareness &amp; anchoring</div></div></div>
    <div class="sw" style="background: color-mix(in srgb, var(--portal-neutral) 88%, white);"><div class="dot" style="background: var(--portal-neutral-accent);"></div><div><div class="name" style="color: var(--portal-neutral-accent);">neutral · 体现与投射</div><div class="sub">Manifest &amp; projection</div></div></div>
  </div>
</body>
</html>
