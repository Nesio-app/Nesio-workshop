<!DOCTYPE html>
<html data-portal-theme="day" lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); color: var(--portal-ink); background: var(--portal-bg); padding: 24px; }
  .line { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .tag { font-size: 0.62rem; font-weight: 700; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--portal-blue-deep); width: 46px; flex: none; }
  .body { font-size: var(--text-body); line-height: var(--leading-snug); }
</style>
</head>
<body>
  <div class="line"><span class="tag">ZH</span><span class="body">还有一件事可以轻轻处理，明天再决定也可以。</span></div>
  <div class="line"><span class="tag">EN</span><span class="body">One small thing you could gently handle — later is fine too.</span></div>
  <div class="line"><span class="tag">JA</span><span class="body">そっと片づけられることが一つ。あとで決めても大丈夫。</span></div>
  <div class="line"><span class="tag">KO</span><span class="body">가볍게 처리할 수 있는 일 하나. 나중에 결정해도 괜찮아요.</span></div>
</body>
</html>
